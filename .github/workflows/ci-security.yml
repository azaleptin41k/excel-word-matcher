name: CI & Security Pipeline

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

# Минимальные права по умолчанию; джобы, которым нужно больше, расширяют их сами
permissions:
  contents: read

# Все сторонние actions закреплены по полному SHA коммита, а не по тегу:
# тег можно перезаписать (см. компрометацию trivy-action в марте 2026, GHSA-69fq-xp46-6x23).
# Комментарий справа — версия, которой соответствует SHA. Обновлять через Dependabot.

jobs:
  # ── 1. Lint & Format Check ────────────────────────────────────────────────
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Install Ruff
        run: pip install ruff==0.8.6

      - name: Run Ruff linter
        run: ruff check . --output-format=github

      - name: Run Ruff formatter check
        run: ruff format --check .

  # ── 2. Unit Tests ─────────────────────────────────────────────────────────
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short

  # ── 3. SAST — Bandit ──────────────────────────────────────────────────────
  # Блокирует при находках severity >= medium и confidence >= medium.
  # -c pyproject.toml обязателен: без него Bandit игнорирует [tool.bandit] (exclude_dirs, skips).
  # Принятый риск помечается в коде как `# nosec BXXX  <причина>`.
  sast-bandit:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Install Bandit
        run: pip install "bandit[toml]==1.8.3"

      - name: Run Bandit (report)
        run: bandit -c pyproject.toml -r . -f json -o bandit-report.json --exit-zero

      - name: Run Bandit (gate)
        run: bandit -c pyproject.toml -r . --severity-level medium --confidence-level medium

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bandit-report
          path: bandit-report.json

  # ── 4. Secret Scanning — Gitleaks ─────────────────────────────────────────
  # Падает сам при найденном секрете (сканирует всю историю).
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 5. Dependency Audit — pip-audit ───────────────────────────────────────
  # Блокирует при любой известной уязвимости в зависимостях.
  # Принятый риск: добавить `--ignore-vuln <ID>` и описать причину в SECURITY.md.
  dependency-audit:
    name: Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit (report)
        run: pip-audit -r requirements.txt --format json --output pip-audit-report.json || true

      - name: Run pip-audit (gate)
        run: pip-audit -r requirements.txt --strict

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json

  # ── 6. Docker Build + Trivy Scan + SBOM ───────────────────────────────────
  # Образ собирается один раз; скан и SBOM делаются по нему же.
  # Gate: CRITICAL/HIGH, для которых есть исправление (ignore-unfixed).
  # Принятые риски — в .trivyignore с комментарием и датой пересмотра.
  docker-security:
    name: Docker Build, Scan (Trivy) & SBOM (Syft)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # загрузка SARIF в GitHub Security
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build Docker image
        run: docker build -t excel-word-matcher:${{ github.sha }} .

      - name: Trivy SARIF report (non-blocking, for GitHub Security tab)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: excel-word-matcher:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload Trivy SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
        with:
          sarif_file: trivy-results.sarif

      - name: Trivy gate (fails on fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: excel-word-matcher:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"

      - name: Generate SBOM with Syft
        if: always()
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: excel-word-matcher:${{ github.sha }}
          artifact-name: sbom-excel-word-matcher.spdx.json
          format: spdx-json

  # ── 7. Publish & Sign (только master) ─────────────────────────────────────
  # Публикация образа в GHCR и keyless-подпись через cosign (Sigstore, OIDC-токен GitHub).
  # Запускается только если все проверки прошли.
  # Проверка подписи:
  #   cosign verify ghcr.io/azaleptin41k/excel-word-matcher@<digest> \
  #     --certificate-identity-regexp 'https://github.com/azaleptin41k/excel-word-matcher/.*' \
  #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
  publish-and-sign:
    name: Publish to GHCR & Sign (cosign)
    runs-on: ubuntu-latest
    needs: [lint, test, sast-bandit, secret-scan, dependency-audit, docker-security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write   # push в GHCR
      id-token: write   # OIDC-токен для keyless-подписи
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        id: push
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/excel-word-matcher
          docker build -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:${{ github.sha }}"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:${{ github.sha }}")
          echo "ref=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Sign image by digest
        run: cosign sign --yes "${{ steps.push.outputs.ref }}"

  # ── 8. Final Gate ─────────────────────────────────────────────────────────
  # Единая обязательная проверка для branch protection:
  # PR нельзя смержить, если хоть одна проверка не прошла.
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [lint, test, sast-bandit, secret-scan, dependency-audit, docker-security]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          echo "=== Security Pipeline Summary ==="
          echo "Lint:             ${{ needs.lint.result }}"
          echo "Tests:            ${{ needs.test.result }}"
          echo "SAST (Bandit):    ${{ needs.sast-bandit.result }}"
          echo "Secret Scan:      ${{ needs.secret-scan.result }}"
          echo "Dependency Audit: ${{ needs.dependency-audit.result }}"
          echo "Docker/Trivy/SBOM:${{ needs.docker-security.result }}"
          echo "================================="
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "❌ Security gate failed"
            exit 1
          fi
          echo "✅ All checks passed"
