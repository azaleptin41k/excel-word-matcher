name: Build App via Docker (CI)

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build builder image
      run: docker build -t excel-word-matcher-builder .

    - name: Run compilation inside Docker
      run: docker run --rm -v ${{ github.workspace }}/dist:/app/dist excel-word-matcher-builder

    - name: Upload compiled artifact
      uses: actions/upload-artifact@v4
      with:
        name: excel-word-matcher-binary
        path: dist/
