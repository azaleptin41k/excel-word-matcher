name: Build App via Docker (CI)

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker image (multi-stage)
      run: docker build -t excel-word-matcher .

    - name: Extract compiled binary from image
      run: |
        docker create --name extract excel-word-matcher
        docker cp extract:/app/dist/ ./dist/
        docker rm extract

    - name: Upload compiled artifact
      uses: actions/upload-artifact@v4
      with:
        name: excel-word-matcher-binary
        path: dist/
